<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Padlizsan app – belépés</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: radial-gradient(circle at top, #2a1850, #0f0b1a 60%); color: #ece8f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .kartya { max-width: 420px; margin: 20px; background: #1b1530; border: 1px solid #2f2650; border-radius: 16px; padding: 26px; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.4rem; margin: 10px 0; }
  p { color: #a59cc0; line-height: 1.5; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 12px; font-size: 1.05rem; font-weight: 700; color: #fff; background: linear-gradient(90deg, #7c3aed, #a855f7); cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: .6; }
  .hiba { color: #fca5a5; min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="kartya">
  <img src="/assets/studio-icon.png" alt="">
  <h1>Padlizsan Android-app</h1>
  <p id="szoveg">Betöltés…</p>
  <button id="engedely" hidden>Engedélyezem</button>
  <p class="hiba" id="hiba"></p>
</div>
<script src="/js/app-login.js"></script>
</body>
</html>
