<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadlizsánFanSub - Profilom</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favico.png">
<link rel="stylesheet" href="/css/sidebar.css?v=20260119">
<link rel="stylesheet" href="/css/search.css?v=20260619">
<link rel="stylesheet" href="/css/grid.css?v=20260119">
<link rel="stylesheet" href="/css/header.css?v=20260619">
<link rel="stylesheet" href="/css/profile.css?v=20260619">
<link rel="stylesheet" href="/css/footer.css?v=20260405">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs/dist/cropper.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div id="header-root"></div>
<div id="sidebar-root"></div>

<main class="content">
<h1>My Profile</h1>
<div class="avatar-container">
  <img id="avatar" src="https://padlizsanfansub.hu/assets/logo.png" />
  <div class="avatar-edit" onclick="openUpload()">✏️</div>
</div>
<input type="file" id="fileInput" hidden />

<section style="
  margin: 24px 0; padding: 18px 20px; background: #0f0f1a;
  border: 1px solid rgba(255,255,255,.1); border-radius: 14px; max-width: 480px;
">
  <h2 style="margin:0 0 10px; font-size:1.1rem;">📚 AniList szinkron</h2>
  <p id="anilistSyncHint" class="hidden" style="margin:0 0 12px; font-size:.85rem; color:#888;">
    Előbb kösd össze az AniList fiókodat a <a href="/settings.html" style="color:#c4b5fd;">Beállításokban</a>.
  </p>
  <button id="anilistSyncBtn" style="
    background:linear-gradient(135deg,#7c3aed,#5b21b6); border:none; color:#fff;
    padding:9px 22px; border-radius:9px; cursor:pointer; font-size:.88rem; font-weight:700;
  ">🔄 Szinkronizálás</button>
  <span id="anilistSyncFeedback" style="margin-left:12px; font-size:.85rem; font-weight:600;"></span>
</section>

<div id="modal" style="display:none;">
  <div class="modal-content">
    <!-- JOBB FELÜL X GOMB -->
    <div class="modal-close" onclick="closeModal()">×</div>
    <div class="editor-layout">
      
      <!-- BAL: crop -->
      <div class="crop-container">
        <img id="preview" />
      </div>

      <!-- JOBB: live preview -->
      <div class="preview-side">
        <div class="preview-circle">
          <img id="preview-small" />
        </div>
        <p>Előnézet</p>
      </div>

    </div>

    <!-- ZOOM -->
    <input type="range" id="zoomSlider" min="0" max="3" step="0.01" value="1">

    <button onclick="saveAvatar()">Mentés</button>
  </div>
</div>
<script src="/js/profile-init.js?v=20260619"></script>
<script src="/js/anilist-sync-modal.js?v=20260720"></script>
<div id="footer"></div>
<script src="/js/footer.js?v=20260619"></script>

<script type="module" src="/js/layout-loader.js?v=20260713"></script>
<script src="/js/sidebar.js?v=20260204"></script>
<script src="/js/auth-check.js?v=20260323"></script>
<script type="module" src="/js/avatar.js?v=20260323"></script>

</body>
</html>
