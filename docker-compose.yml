services:

  app:
    # IMAGE_TAG: "stable" = a legutóbbi kiadás (ajánlott), "latest" = a
    # fejlesztői ág legfrissebb állapota, vagy konkrét verzió (pl. 1.2.0)
    image: krusk/padlizsanfansub:${IMAGE_TAG:-latest}
    # Saját buildhez: docker compose up -d --build
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # Docker hálózaton a postgres service neve "db"
      PGHOST: db
    volumes:
      # Feltöltött fájlok (profilképek, borítók)
      - ./uploads:/app/uploads
      # Generált blog HTML fájlok
      - ./public/blog:/app/public/blog
      # Logok
      - ./logs:/app/logs
      # PadliCrome-bővítmény munkaprojektjei (feltöltött / fordított képek)
      - ./padlicrome:/mnt/manga2/padlicrome
      # Manga képek — a MANGA_ROOT env változóban beállított útvonal
      # Fontos: a konténeren belül ugyanaz az útvonal legyen mint a hoszton.
      # Írható: a feltöltő felület (UPLOADER_BASE_DIR) ide menti a fájlokat.
      - ${MANGA_ROOT:-/mnt/manga}:${MANGA_ROOT:-/mnt/manga}
      # Saját logó / favicon (lásd BRANDING_DIR)
      - ./branding:/app/branding:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       ${PGDATABASE:-padli}
      POSTGRES_USER:     ${PGUSER:-padli}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Állítsd be a PGPASSWORD változót a .env fájlban}
    volumes:
      # Adatbázis adatok perzisztálása
      - postgres_data:/var/lib/postgresql/data
      # A sémát és a migrációkat az app tölti be induláskor (server/lib/migrate.js)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-padli} -d ${PGDATABASE:-padli}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
