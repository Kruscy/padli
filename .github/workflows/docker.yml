name: Build & Push Docker Image

# main: "latest" (+ commit-sha) image; v* tag (pl. v1.2.0): verziószámos és
# "stable" image + GitHub Release — a telepítések ez alapján frissülnek
on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  # Az image csak zöld tesztekkel épül (ugyanaz a workflow, mint push/PR-nél)
  test:
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A tag és a package.json verziója egyezzen (az app ezt mutatja és
      # ezt veti össze a legújabb kiadással)
      - name: Verzió-ellenőrzés (tag = package.json)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p 'require("./package.json").version')"
          [ "$PKG" = "${GITHUB_REF_NAME}" ] || { echo "A tag (${GITHUB_REF_NAME}) és a package.json ($PKG) eltér"; exit 1; }

      - name: Docker metadata (tag-ek)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: krusk/padlizsanfansub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Docker Buildx beállítása
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub bejelentkezés
        uses: docker/login-action@v3
        with:
          username: krusk
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build és push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Kiadás a GitHubon (változáslistával) — a telepítések frissítés-jelzése
  # a legújabb kiadást nézi
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
